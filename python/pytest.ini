# pytest config for the Python prep notes only (the real framework is TypeScript/Playwright).
# Run from the project root:  python/.venv/Scripts/python -m pytest python
[pytest]
testpaths = .
addopts = -ra --strict-markers
xfail_strict = true
markers =
    smoke: fast, critical-path checks (run on every commit)
    regression: the full suite (nightly)
    api: talks to an API layer
    creates_data: creates real data that a fixture must clean up
